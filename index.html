<title>Event HUD</title>
<!-- 見た目のファイルより先に背景を暗くしておく（読み込み途中や、戻ったときに白い画面が見えないように） -->
<style>html,body{background:#0b1020;color:#f2f6ff;margin:0}.boot{padding:40vh 16px 0;text-align:center;font:700 14px sans-serif;letter-spacing:.2em;color:#4fd8ff}</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon.svg">

</head>
<body>
<div id="app">
<a class="skip" href="#view">本文へ移動</a>
<header class="top">
  <span class="brand">EVENT HUD</span>
  <span class="sync" id="sync" aria-live="polite"></span>
  <button class="icon-btn" id="refresh" type="button" aria-label="日程を更新"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 11-2.4-5.7"/><path d="M20 4v5h-5"/></svg></button>
  <button class="icon-btn" id="dataBtn" type="button" aria-label="データの読み込み"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg></button>
</header>
<main id="view" tabindex="-1"><p class="boot" role="status">EVENT HUD 読み込み中…</p></main>
<nav class="nav" id="nav" aria-label="画面の切り替え">
  <a href="#/home" data-tab="home"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/></svg>ホーム</a>
  <a href="#/list" data-tab="list"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 9h16M8 3v4M16 3v4M8 13h3M8 16h6"/></svg>予定</a>
</nav>
</div>
